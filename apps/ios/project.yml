# XcodeGen spec for the iPhone app. Generate the Xcode project with:
#   brew install xcodegen && cd apps/ios && xcodegen generate
name: Viksen
options:
  bundleIdPrefix: com.krowsingre
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    # Repo root (engine/, core/, platform/) and vendored third-party headers.
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../.."
      - "$(SRCROOT)/../../third_party"
      - "$(SRCROOT)/../../third_party/pffft"
      - "$(SRCROOT)/../../third_party/steamaudio/include"
    SWIFT_VERSION: "5.0"

targets:
  # Shared C++ engine + core + iOS platform adapters, compiled from the same
  # sources as the desktop build (no copies).
  AtmosEngine:
    type: library.static
    platform: iOS
    sources:
      - path: ../../engine
        excludes: ["**/CMakeLists.txt", "**/*.md"]
      - path: ../../core
        excludes: ["**/CMakeLists.txt", "**/*.md"]
      - path: ../../platform/ios
        excludes: ["**/*.md"]
      # Support code Steam Audio's iOS static library expects the app to provide.
      - path: ../../third_party/pffft
        excludes: ["**/*.md", "LICENSE.txt", "PFFFT_SOURCE.txt"]
      - path: ../../third_party/mysofa_stub
    settings:
      base:
        SKIP_INSTALL: YES
        # Steam Audio ships an arm64 *device* library only: HRTF binaural on iPhone,
        # interim panner in the Simulator.
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphoneos*]": ["$(inherited)", "ATMOS_WITH_STEAM_AUDIO=1"]

  Viksen:
    type: application
    platform: iOS
    sources:
      - path: Viksen
        excludes: ["Resources/Worlds/**"]
      # Worlds are copied as a folder so each World keeps its own directory.
      - path: Viksen/Resources/Worlds
        type: folder
        buildPhase: resources
    dependencies:
      - target: AtmosEngine
      - target: ViksenWatch
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMotion.framework
      - sdk: QuartzCore.framework
      - sdk: HealthKit.framework
      - sdk: StoreKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
    entitlements:
      path: Viksen/Resources/Viksen.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_NAME: Viksen
        PRODUCT_BUNDLE_IDENTIFIER: com.krowsingre.viksen   # registered App ID
        DEVELOPMENT_TEAM: JNJX9FYHC2                       # owner's Apple Developer team
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Viksen/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Viksen/Bridge/Viksen-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"          # iPhone first; iPad evaluated later
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: ["-lc++"]
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["-lc++", "$(SRCROOT)/../../third_party/steamaudio/lib/ios/libphonon.a"]

  # Apple Watch companion: runs workouts and streams live heart rate to the iPhone.
  ViksenWatch:
    type: application
    platform: watchOS
    sources:
      - path: ViksenWatch
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
    entitlements:
      path: ViksenWatch/Resources/ViksenWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: ViksenWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.krowsingre.viksen.watchkitapp
        INFOPLIST_FILE: ViksenWatch/Resources/Info.plist
        DEVELOPMENT_TEAM: JNJX9FYHC2
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"

  # Mac: the same engine and core, with Core Audio through miniaudio instead of
  # RemoteIO/AVAudioSession. iPhone-only adapters (session, RemoteIO, accelerometer)
  # are left out; decoding still uses AVFoundation.
  AtmosEngineMac:
    type: library.static
    platform: macOS
    sources:
      - path: ../../engine
        excludes: ["**/CMakeLists.txt", "**/*.md"]
      - path: ../../core
        excludes: ["**/CMakeLists.txt", "**/*.md"]
      - path: ../../platform/desktop/MiniaudioHost.cpp
      - path: ../../third_party/miniaudio/miniaudio.c
      - path: ../../platform/ios/AtmosTypes.m
      - path: ../../platform/ios/IOSMediaDecoder.mm
      - path: ../../platform/ios/IOSStemDecoder.mm
    settings:
      base:
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../../third_party/miniaudio"]
        # Steam Audio's macOS library is universal (arm64 + x86_64) and embedded in the app.
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ATMOS_WITH_STEAM_AUDIO=1"]

  # Mac app: same SwiftUI views as iPhone (Studio first, Experience where the Mac
  # has the inputs). Same bundle id for universal purchase.
  ViksenMac:
    type: application
    platform: macOS
    sources:
      - path: Viksen
        excludes: ["Resources/Worlds/**", "Resources/Info.plist", "Resources/Viksen.entitlements"]
      - path: Viksen/Resources/Worlds
        type: folder
        buildPhase: resources
    dependencies:
      - target: AtmosEngineMac
      - framework: ../../third_party/steamaudio/lib/osx/libphonon.dylib
        embed: true
        codeSign: true
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: QuartzCore.framework
      - sdk: HealthKit.framework
      - sdk: StoreKit.framework
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
    entitlements:
      path: ViksenMac/ViksenMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_NAME: Viksen
        PRODUCT_BUNDLE_IDENTIFIER: com.krowsingre.viksen   # universal purchase with iPhone
        DEVELOPMENT_TEAM: JNJX9FYHC2
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: ViksenMac/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Viksen/Bridge/Viksen-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: ["-lc++"]

schemes:
  ViksenMac:
    build:
      targets:
        ViksenMac: all
    run:
      config: Debug
  Viksen:
    build:
      targets:
        Viksen: all
    run:
      config: Debug
