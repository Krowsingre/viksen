name: Website (GitHub Pages)

# Publishes site/ (home, privacy policy, support) to GitHub Pages.
# One-time: repository Settings → Pages → Source: "GitHub Actions".
# Contact address comes from the repository VARIABLE SITE_CONTACT_EMAIL
# (Settings → Secrets and variables → Actions → Variables).

on:
  workflow_dispatch:
  push:
    paths: ['site/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill in contact and date
        env:
          CONTACT: ${{ vars.SITE_CONTACT_EMAIL }}
        run: |
          if [ -z "$CONTACT" ]; then
            echo "::error::Set the repository variable SITE_CONTACT_EMAIL before publishing."
            exit 1
          fi
          mkdir -p _site && cp site/* _site/
          date=$(git log -1 --format=%cs -- site/privacy.html)
          sed -i "s|{{CONTACT_EMAIL}}|$CONTACT|g; s|{{EFFECTIVE_DATE}}|$date|g" _site/*.html
          if grep -l '{{' _site/*.html; then echo "::error::Unfilled placeholder"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
