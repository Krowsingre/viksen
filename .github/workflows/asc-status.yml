name: App Store Connect status

# Read-only report: build processing state, TestFlight state and tester groups.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/key.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/key.p8" python3 tools/asc_status.py
          rm -f "$RUNNER_TEMP/key.p8"
