name: iPhone → TestFlight

# Builds a signed release of the iPhone app on GitHub's macOS runners and uploads
# it to App Store Connect / TestFlight. No Mac needed.
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  App Store Connect issuer ID
#   ASC_KEY_P8     full text of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role so Xcode can create the distribution certificate
# and provisioning profile in the cloud (automatic signing).

on:
  workflow_dispatch:        # Actions tab → "iPhone → TestFlight" → Run workflow
  push:
    tags: ['ios-v*']        # or push a tag such as ios-v0.1.0

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; missing=1; fi
          done
          exit $missing

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Dimension audio is not in the app: each Dimension is an Apple-hosted asset pack
      # (see asset-packs.yml) that the app downloads when the listener chooses it.

      - name: Fetch Steam Audio SDK (pinned, checksum-verified)
        run: ./tools/fetch_steam_audio.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # Normalise: Windows line endings, stray spaces around IDs.
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_ID_CLEAN=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID_CLEAN=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          head -1 "$RUNNER_TEMP/asc/AuthKey.p8" | grep -q -- '-----BEGIN PRIVATE KEY-----' \
            || { echo "::error::ASC_KEY_P8 does not start with -----BEGIN PRIVATE KEY-----. Paste the whole .p8 file."; exit 1; }

      - name: Verify API key with App Store Connect
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null \
            || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "asc", "AuthKey.p8")).read()
          kid, iss = os.environ["ASC_KEY_ID_CLEAN"], os.environ["ASC_ISSUER_ID_CLEAN"]
          print(f"Key ID length {len(kid)}, issuer ID length {len(iss)} (expected 10 and 36)")
          def call(payload):
              now = int(time.time())
              payload.update({"iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"})
              token = jwt.encode(payload, key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
              req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.krowsingre.viksen",
                                           headers={"Authorization": f"Bearer {token}"})
              try:
                  return 200, json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
          status, data = call({"iss": iss})                 # team key
          if status != 200:
              team_status = status
              status, _ = call({"sub": "user"})              # individual key (no issuer)
              if status == 200:
                  print("::error::This is an INDIVIDUAL API key. Xcode cloud signing needs a TEAM key: App Store Connect > "
                        "Users and Access > Integrations > App Store Connect API > Team Keys > + (role Admin). "
                        "Then update ASC_KEY_ID and ASC_KEY_P8 (ASC_ISSUER_ID is shown on that page).")
              else:
                  print(f"::error::App Store Connect rejected the API key (HTTP {team_status}). The Key ID, Issuer ID and .p8 "
                        "probably do not belong together, or the key was revoked. Create a new Team Key (role Admin) and "
                        "update all three secrets from that same key.")
                  print(data)
              sys.exit(1)
          apps = data.get("data", [])
          if not apps:
              print("::error::Key works, but no app record with bundle ID com.krowsingre.viksen was found in App Store Connect.")
              sys.exit(1)
          print("API key OK; app record found:", apps[0]["attributes"].get("name"))
          PY

      # Every run starts on a fresh runner, so Xcode creates a new development
      # certificate; Apple caps how many a team can have. Owner-approved: revoke the
      # old CI-made ones ("Created via API") first, and this run's own at the end.
      - name: Revoke old CI development certificates
        run: |
          export ASC_KEY_ID="$ASC_KEY_ID_CLEAN" ASC_ISSUER_ID="$ASC_ISSUER_ID_CLEAN" ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          # Housekeeping never blocks a build.
          python3 tools/asc_ci_certs.py prune || echo "::warning::could not prune old certificates"
          python3 tools/asc_ci_certs.py snapshot "$RUNNER_TEMP/certs-before.json" || echo "::warning::certificate snapshot failed"

      # The Viksen Dimension's theme (Lunar Promise) ships inside the app. The owner's
      # music lives only in the private assets repository; it is copied into the build
      # here and never committed to this repository (.gitignore excludes it).
      - name: Bundle the Viksen Dimension's audio (private assets)
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          [ -n "$ASSETS_TOKEN" ] || { echo "::error::ASSETS_TOKEN is not set"; exit 1; }
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${ASSETS_TOKEN}@github.com/Krowsingre/viksen-assets.git" "$RUNNER_TEMP/assets"
          git -C "$RUNNER_TEMP/assets" sparse-checkout set theme/lunar-promise theme/lunar-dark-promise theme/lunar-storm-promise theme/threshold ambience/weather ambience/transitions
          dest=apps/ios/Viksen/Resources/Worlds/viksen
          for f in "$RUNNER_TEMP/assets/theme/lunar-promise/"*.m4a; do
            cp "$f" "$dest/lunar-promise-$(basename "$f")"
          done
          ls -la "$dest"
          n=$(ls "$dest"/lunar-promise-*.m4a | wc -l); [ "$n" -eq 11 ] || { echo "::error::expected 11 stems, found $n"; exit 1; }
          # Lunar Dark Promise: the Viksen Dimension's New Moon night song.
          for f in "$RUNNER_TEMP/assets/theme/lunar-dark-promise/"*.m4a; do
            cp "$f" "$dest/lunar-dark-promise-$(basename "$f")"
          done
          n=$(ls "$dest"/lunar-dark-promise-*.m4a | wc -l); [ "$n" -eq 12 ] || { echo "::error::expected 12 dark stems, found $n"; exit 1; }
          # Lunar Storm Promise: plays when it rains.
          for f in "$RUNNER_TEMP/assets/theme/lunar-storm-promise/"*.m4a; do
            cp "$f" "$dest/lunar-storm-promise-$(basename "$f")"
          done
          n=$(ls "$dest"/lunar-storm-promise-*.m4a | wc -l); [ "$n" -eq 12 ] || { echo "::error::expected 12 storm stems, found $n"; exit 1; }
          # The optional opening sound: loops A, B (home) and C, each with its following bar.
          cp "$RUNNER_TEMP/assets/theme/threshold/"threshold-?.wav "$dest/"
          [ "$(ls "$dest"/threshold-?.wav | wc -l)" -eq 3 ] || { echo "::error::expected 3 opening loops"; exit 1; }
          # Rain and thunder ambience (plays under the music while it rains).
          mkdir -p apps/ios/Viksen/Resources/Worlds/_ambience
          cp "$RUNNER_TEMP/assets/ambience/weather/"*.wav "$RUNNER_TEMP/assets/ambience/weather/"*.caf apps/ios/Viksen/Resources/Worlds/_ambience/
          cp "$RUNNER_TEMP/assets/ambience/transitions/"*.caf apps/ios/Viksen/Resources/Worlds/_ambience/
          ls -la apps/ios/Viksen/Resources/Worlds/_ambience
          rm -rf "$RUNNER_TEMP/assets"

      - name: Archive (signed, build number = run number)
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project Viksen.xcodeproj -scheme Viksen -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Viksen.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_CLEAN" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export and upload to App Store Connect
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Viksen.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_CLEAN"

      - name: Revoke this run's development certificate
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/certs-before.json" ] || exit 0
          ASC_KEY_ID="$ASC_KEY_ID_CLEAN" ASC_ISSUER_ID="$ASC_ISSUER_ID_CLEAN" ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8" \
            python3 tools/asc_ci_certs.py cleanup "$RUNNER_TEMP/certs-before.json" || echo "::warning::could not revoke this run's certificate"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
