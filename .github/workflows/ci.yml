name: CI

# Runs only when started by hand (owner, 2026-11-05: saves build minutes for a private
# repository). Actions tab -> CI -> Run workflow. Engine tests run on Linux and Windows;
# Mac runners are skipped unless "mac" is ticked (owner, 2026-11-13: Mac minutes cost ten
# times as much; the TestFlight workflow compiles the iPhone app anyway). Tick "all_apps"
# to also build the desktop, Mac and Windows apps.
on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Also run the Mac jobs (iPhone simulator build, macOS engine tests)"
        type: boolean
        default: false
      all_apps:
        description: "Also build the desktop, Mac and Windows apps"
        type: boolean
        default: false

jobs:
  engine-tests:
    name: Engine & core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.mac && '["ubuntu-latest", "windows-latest", "macos-14"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: "Fetch Steam Audio SDK (Linux: tests the real HRTF path)"
        if: runner.os == 'Linux'
        run: ./tools/fetch_steam_audio.sh
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DATMOS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark (informational)
        shell: bash
        run: |
          bin=$(find build -type f \( -name atmos_benchmark -o -name atmos_benchmark.exe \) | head -1)
          "$bin"

  desktop:
    # iPhone first (owner): other platforms build only on manual runs.
    if: inputs.all_apps
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: macOS (arm64)
            os: macos-14
            configure: -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Artwork (private assets)
        shell: bash
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: tools/fetch_art.sh
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build-desktop ${{ matrix.configure }} -DATMOS_BUILD_DESKTOP=ON -DATMOS_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-desktop --config Release --target AtmosDesktop --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: build-desktop/apps/desktop/AtmosDesktop_artefacts
          retention-days: 7

  ios:
    name: iPhone app (simulator build)
    if: inputs.mac
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Artwork (private assets)
        shell: bash
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: tools/fetch_art.sh
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild -project Viksen.xcodeproj -scheme Viksen \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  mac:
    # iPhone first (owner): other platforms build only on manual runs.
    if: inputs.all_apps
    name: Mac app (build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Artwork (private assets)
        shell: bash
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: tools/fetch_art.sh
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch Steam Audio
        run: tools/fetch_steam_audio.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild -project Viksen.xcodeproj -scheme ViksenMac \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build

  windows-app:
    # iPhone first (owner): other platforms build only on manual runs.
    if: inputs.all_apps
    name: Windows app (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Artwork (private assets)
        shell: bash
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: tools/fetch_art.sh
      - name: Fetch Steam Audio
        shell: bash
        run: tools/fetch_steam_audio.sh
      - name: Build engine DLL
        run: |
          cmake -S . -B build-win -DATMOS_BUILD_TESTS=OFF -DATMOS_WARNINGS_AS_ERRORS=ON
          cmake --build build-win --config Release --target viksen_engine --parallel
          Copy-Item third_party/steamaudio/lib/windows-x64/phonon.dll build-win/Release/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build app
        run: msbuild apps/windows/Viksen/Viksen.csproj -restore -p:Configuration=Release -p:Platform=x64 -v:minimal
      - name: XAML compiler report
        if: failure()
        shell: bash
        run: find apps/windows/Viksen/obj -name output.json -exec cat {} \; || true
      - name: Check the engine is in the output
        shell: bash
        run: |
          out=$(find apps/windows/Viksen/bin -name Viksen.exe | head -1)
          echo "$out"; dir=$(dirname "$out"); ls "$dir" | grep -E "viksen_engine.dll|phonon.dll|Worlds"
